<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'"
    />
    <title>Toast</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="webviews"></div>
    <div id="switcher" hidden><div id="switcher-row"></div></div>
    <div id="setup" hidden>
      <div id="setup-card">
        <div class="setup-title">Welcome to toast</div>
        <div class="setup-sub">Choose your default search engine</div>
        <div id="engines"></div>
      </div>
    </div>
    <div id="dl-toast" hidden></div>
    <div id="drag-strip"></div>
    <script src="chrome.js"></script>
  </body>
</html>
