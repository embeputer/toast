<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'"
    />
    <title>Toast</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="webviews"></div>

    <div id="drag-strip"></div>

    <div id="lights-pill"></div>

    <div id="url-pill" title="Click to edit address">
      <div id="progress"></div>
      <div id="tab-label">
        <img id="favicon" alt="" draggable="false" />
        <span id="tab-title">New Tab</span>
      </div>
      <input
        id="url-input"
        type="text"
        placeholder="Search or enter website name"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        hidden
      />
    </div>

    <script src="chrome.js"></script>
  </body>
</html>
