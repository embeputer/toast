<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>New Tab</title>
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
        background: #f5f4f2;
        color: #3a3835;
      }
      .wordmark {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 44px;
        font-weight: 700;
        letter-spacing: -0.02em;
        /* letterpress: pressed into the surface */
        color: rgba(0, 0, 0, 0.11);
        text-shadow:
          0 -1px 1px rgba(0, 0, 0, 0.2),
          0 1px 1px rgba(255, 255, 255, 0.95),
          0 2px 3px rgba(0, 0, 0, 0.04);
        user-select: none;
      }
      #search {
        width: min(460px, 70vw);
        height: 40px;
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 20px;
        padding: 0 18px;
        font-size: 15px;
        font: inherit;
        background: rgba(255, 255, 255, 0.7);
        color: inherit;
        outline: none;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
      }
      #search:focus {
        border-color: rgba(0, 113, 227, 0.5);
        box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.18);
        background: #fff;
      }
      #search::placeholder {
        color: #9a978f;
      }
      .hint {
        position: fixed;
        bottom: 26px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 13px;
        color: #8a8781;
      }
      kbd {
        font: 12px -apple-system, sans-serif;
        color: #8a8781;
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 1px 5px;
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #242322;
          color: #e8e6e3;
        }
        #search {
          background: rgba(255, 255, 255, 0.08);
          border-color: rgba(255, 255, 255, 0.16);
        }
        #search:focus {
          background: rgba(255, 255, 255, 0.12);
          border-color: rgba(66, 153, 255, 0.6);
          box-shadow: 0 0 0 3px rgba(66, 153, 255, 0.22);
        }
        #search::placeholder {
          color: #7d7a75;
        }
        .wordmark {
          color: rgba(255, 255, 255, 0.1);
          text-shadow:
            0 -1px 1px rgba(0, 0, 0, 0.55),
            0 1px 1px rgba(255, 255, 255, 0.07);
        }
        .hint {
          color: #8f8c87;
        }
        kbd {
          background: #383736;
          color: #8f8c87;
          border-color: rgba(255, 255, 255, 0.14);
        }
      }
    </style>
  </head>
  <body>
    <div class="wordmark">toast</div>
    <input
      id="search"
      type="text"
      placeholder="Search or enter website name"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      autofocus
    />
    <div class="hint"><kbd>&#8984;K</kbd> for the command toast &nbsp;&middot;&nbsp; <kbd>&#8984;T</kbd> new tab &nbsp;&middot;&nbsp; <kbd>&#8963;Tab</kbd> switch tabs</div>
    <script>
      const input = document.getElementById('search');
      input.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        const s = input.value.trim();
        if (!s) return;
        let url;
        if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(s)) {
          url = s;
        } else if (/^localhost(:\d+)?([/?#]|$)/.test(s) || /^[^\s]+\.[^\s]{2,}$/.test(s)) {
          url = `https://${s}`;
        } else {
          url = `https://www.google.com/search?q=${encodeURIComponent(s)}`;
        }
        window.location.href = url;
      });
      window.addEventListener('DOMContentLoaded', () => input.focus());
      window.addEventListener('focus', () => input.focus());
    </script>
  </body>
</html>
