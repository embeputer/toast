<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>New Tab</title>
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
        background: #f5f4f2;
        color: #3a3835;
      }
      .logo {
        margin-top: 27vh;
        width: 104px;
        height: 104px;
        /* ghosted imprint on the surface */
        filter: grayscale(1) contrast(0.92);
        opacity: 0.22;
        user-select: none;
        -webkit-user-drag: none;
      }
      #bar {
        margin-top: 17vh;
        display: flex;
        align-items: center;
        width: min(760px, 76vw);
        height: 58px;
        border-radius: 29px;
        background: #fff;
        border: 1px solid rgba(0, 0, 0, 0.08);
        box-shadow:
          0 2px 8px rgba(0, 0, 0, 0.05),
          0 12px 32px rgba(0, 0, 0, 0.07);
      }
      #search {
        flex: 1;
        height: 100%;
        border: none;
        outline: none;
        background: transparent;
        padding: 0 8px 0 26px;
        font: 16px -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
        color: inherit;
      }
      #search::placeholder {
        color: #a3a09a;
      }
      .switch-hint {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-right: 14px;
        font-size: 13px;
        color: #9b9890;
        white-space: nowrap;
        user-select: none;
      }
      .switch-hint kbd {
        font: 12px -apple-system, sans-serif;
        color: #6d6a64;
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-bottom-width: 2px;
        border-radius: 6px;
        padding: 3px 8px;
        background: #f6f5f3;
      }
      .hint {
        position: fixed;
        bottom: 26px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 13px;
        color: #8a8781;
      }
      .hint kbd {
        font: 12px -apple-system, sans-serif;
        color: #8a8781;
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 1px 5px;
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #242322;
          color: #e8e6e3;
        }
        .logo {
          filter: grayscale(1) brightness(1.6) contrast(0.9);
          opacity: 0.16;
        }
        #bar {
          background: rgba(255, 255, 255, 0.09);
          border-color: rgba(255, 255, 255, 0.14);
          box-shadow:
            0 2px 8px rgba(0, 0, 0, 0.25),
            0 12px 32px rgba(0, 0, 0, 0.35);
        }
        #search::placeholder {
          color: #7d7a75;
        }
        .switch-hint {
          color: #8f8c87;
        }
        .switch-hint kbd {
          background: rgba(255, 255, 255, 0.1);
          color: #b8b5b0;
          border-color: rgba(255, 255, 255, 0.14);
        }
        .hint {
          color: #8f8c87;
        }
        .hint kbd {
          background: #383736;
          color: #8f8c87;
          border-color: rgba(255, 255, 255, 0.14);
        }
      }
    </style>
  </head>
  <body>
    <img class="logo" src="icon.png" alt="" draggable="false" />
    <div id="bar">
      <input
        id="search"
        type="text"
        placeholder="Search or type a URL"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        autofocus
      />
      <div class="switch-hint"><kbd>&#8963;Tab</kbd><span>to switch</span></div>
    </div>
    <div class="hint"><kbd>&#8984;K</kbd> for the command toast &nbsp;&middot;&nbsp; <kbd>&#8984;T</kbd> new tab &nbsp;&middot;&nbsp; <kbd>&#8963;Tab</kbd> switch tabs</div>
    <script>
      const input = document.getElementById('search');
      input.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        const s = input.value.trim();
        if (!s) return;
        let url;
        if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(s)) {
          url = s;
        } else if (/^localhost(:\d+)?([/?#]|$)/.test(s) || /^[^\s]+\.[^\s]{2,}$/.test(s)) {
          url = `https://${s}`;
        } else {
          url = `https://www.google.com/search?q=${encodeURIComponent(s)}`;
        }
        window.location.href = url;
      });
      window.addEventListener('DOMContentLoaded', () => input.focus());
      window.addEventListener('focus', () => input.focus());
    </script>
  </body>
</html>
