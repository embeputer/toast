<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>New Tab</title>
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
        background: #f5f4f2;
        color: #3a3835;
      }
      .wordmark {
        position: absolute;
        top: 39%;
        left: 0;
        right: 0;
        text-align: center;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 40px;
        font-weight: 700;
        letter-spacing: -0.02em;
        /* letterpress: pressed into the surface */
        color: rgba(0, 0, 0, 0.12);
        text-shadow:
          0 -1px 1px rgba(0, 0, 0, 0.2),
          0 1px 1px rgba(255, 255, 255, 0.95),
          0 2px 3px rgba(0, 0, 0, 0.04);
        user-select: none;
      }
      #bar {
        display: flex;
        align-items: center;
        width: min(640px, 72vw);
        height: 54px;
        border-radius: 16px;
        background: #fff;
        border: 1px solid rgba(0, 0, 0, 0.08);
        box-shadow:
          0 2px 8px rgba(0, 0, 0, 0.05),
          0 12px 32px rgba(0, 0, 0, 0.07);
      }
      #search {
        flex: 1;
        height: 100%;
        border: none;
        outline: none;
        background: transparent;
        padding: 0 8px 0 26px;
        font: 16px -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
        color: inherit;
      }
      #search::placeholder {
        color: #a3a09a;
      }
      .hint {
        position: fixed;
        bottom: 26px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 13px;
        color: #8a8781;
      }
      .hint kbd {
        font: 12px -apple-system, sans-serif;
        color: #8a8781;
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 1px 5px;
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #242322;
          color: #e8e6e3;
        }
        #bar {
          background: rgba(255, 255, 255, 0.09);
          border-color: rgba(255, 255, 255, 0.14);
          box-shadow:
            0 2px 8px rgba(0, 0, 0, 0.25),
            0 12px 32px rgba(0, 0, 0, 0.35);
        }
        #search::placeholder {
          color: #7d7a75;
        }
        .wordmark {
          color: rgba(255, 255, 255, 0.1);
          text-shadow:
            0 -1px 1px rgba(0, 0, 0, 0.55),
            0 1px 1px rgba(255, 255, 255, 0.07);
        }
        .hint {
          color: #8f8c87;
        }
        .hint kbd {
          background: #383736;
          color: #8f8c87;
          border-color: rgba(255, 255, 255, 0.14);
        }
      }
    </style>
  </head>
  <body>
    <div class="wordmark">toast</div>
    <div id="bar">
      <input
        id="search"
        type="text"
        placeholder="Search or type a URL"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        autofocus
      />
    </div>
    <div class="hint"><kbd>&#8984;K</kbd> for the command toast &nbsp;&middot;&nbsp; <kbd>&#8984;T</kbd> new tab &nbsp;&middot;&nbsp; <kbd>&#8963;Tab</kbd> switch tabs</div>
    <script>
      const input = document.getElementById('search');
      input.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        const s = input.value.trim();
        if (!s) return;
        let url;
        if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(s)) {
          url = s;
        } else if (/^localhost(:\d+)?([/?#]|$)/.test(s) || /^[^\s]+\.[^\s]{2,}$/.test(s)) {
          url = `https://${s}`;
        } else {
          url = `https://www.google.com/search?q=${encodeURIComponent(s)}`;
        }
        window.location.href = url;
      });
      window.addEventListener('DOMContentLoaded', () => input.focus());
      window.addEventListener('focus', () => input.focus());
    </script>
  </body>
</html>
