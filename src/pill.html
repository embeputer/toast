<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src * data:; connect-src 'none'">
  <style>
    :root { color-scheme: light dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    body { font-family: -apple-system, 'SF Pro Text', sans-serif; }

    #pill {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 15px;
      overflow: hidden;
      cursor: text;
    }

    /* CSS-glass fallback when real NSGlassEffectView isn't available */
    body.no-glass #pill {
      background: rgba(246, 246, 248, 0.58);
      backdrop-filter: blur(22px) saturate(1.7);
      -webkit-backdrop-filter: blur(22px) saturate(1.7);
      border: 0.5px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.16), inset 0 1px 0 rgba(255,255,255,0.35);
    }
    @media (prefers-color-scheme: dark) {
      body.no-glass #pill {
        background: rgba(30, 30, 34, 0.55);
        border-color: rgba(255, 255, 255, 0.14);
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.08);
      }
    }

    #tab-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 0;
      padding: 0 12px;
    }
    body.editing #tab-label { display: none; }

    #favicon {
      width: 14px; height: 14px; border-radius: 3px; flex: none;
      object-fit: contain;
    }
    #favicon[src=""] { display: none; }
    #tab-title {
      font-size: 12.5px;
      font-weight: 500;
      color: rgba(0,0,0,0.82);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 380px;
    }
    @media (prefers-color-scheme: dark) {
      #tab-title { color: rgba(255,255,255,0.88); }
    }

    #url-input {
      display: none;
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      font: inherit;
      font-size: 12.5px;
      color: rgba(0,0,0,0.85);
      text-align: center;
      padding: 0 14px;
    }
    @media (prefers-color-scheme: dark) {
      #url-input { color: rgba(255,255,255,0.9); }
    }
    body.editing #url-input { display: block; }

    #progress {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 0%;
      background: rgba(0, 113, 227, 0.18);
      transition: width 0.2s;
      pointer-events: none;
      z-index: -1;
    }
    @media (prefers-color-scheme: dark) {
      #progress { background: rgba(66, 153, 255, 0.28); }
    }
  </style>
</head>
<body>
  <div id="pill">
    <div id="progress"></div>
    <div id="tab-label">
      <img id="favicon" src="" alt="">
      <span id="tab-title">New Tab</span>
    </div>
    <input id="url-input" type="text" spellcheck="false"
           autocomplete="off" autocorrect="off" autocapitalize="off"
           placeholder="Search or enter website name">
  </div>
  <script src="pill.js"></script>
</body>
</html>
