<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  #card {
    display: flex; gap: 10px; padding: 14px;
    max-width: 100%; overflow: hidden;
    border-radius: 22px;
    background: rgba(245, 245, 247, 0.72);
    backdrop-filter: blur(28px) saturate(1.8);
    -webkit-backdrop-filter: blur(28px) saturate(1.8);
    border: 0.5px solid rgba(0,0,0,0.12);
    box-shadow: 0 18px 50px rgba(0,0,0,0.22), 0 2px 8px rgba(0,0,0,0.10);
  }
  .chip {
    flex: 0 1 168px; min-width: 0;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 12px 10px 9px;
    border-radius: 14px;
    font-size: 12px; font-weight: 500; color: #1d1d1f;
    background: rgba(255,255,255,0.35);
    border: 0.5px solid rgba(0,0,0,0.06);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chip.sel {
    background: rgba(255,255,255,0.9);
    border-color: rgba(0,0,0,0.18);
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  }
  .chip .title { max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
  .chip .idx { font-size: 10px; opacity: 0.4; }
  @media (prefers-color-scheme: dark) {
    #card { background: rgba(28,28,30,0.72); border-color: rgba(255,255,255,0.14); }
    .chip { background: rgba(255,255,255,0.06); color: #f2f2f7;
            border-color: rgba(255,255,255,0.08); }
    .chip.sel { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.3); }
  }
</style>
</head>
<body>
<div id="card"></div>
<script>
  const card = document.getElementById('card');
  window.__setTabs = function(tabs, sel) {
    card.innerHTML = '';
    tabs.forEach((t, i) => {
      const c = document.createElement('div');
      c.className = 'chip' + (i === sel ? ' sel' : '');
      c.innerHTML = '<span class="idx">' + (i + 1) + '</span>' +
                    '<span class="title"></span>';
      c.querySelector('.title').textContent = t.title || 'New Tab';
      card.appendChild(c);
    });
  };
</script>
</body>
</html>
