<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  /* solid panel — translucency over a sibling view just washes out to
     flat white, so the card is opaque like a real macOS HUD */
  #card {
    display: flex; gap: 10px; padding: 14px;
    width: 100%; overflow-x: auto;
    border-radius: 22px;
    background: #ededf1;
    border: 0.5px solid rgba(0,0,0,0.16);
    box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.7);
  }
  .chip {
    flex: 1 1 0; min-width: 64px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 12px 10px 9px;
    border-radius: 14px;
    font-size: 12px; font-weight: 500; color: #1d1d1f;
    background: #f8f8fa;
    border: 0.5px solid rgba(0,0,0,0.10);
    white-space: nowrap;
  }
  .chip.sel {
    background: #ffffff;
    border-color: rgba(0,0,0,0.18);
    box-shadow: 0 2px 8px rgba(0,0,0,0.10);
  }
  .chip .title { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .chip .idx { font-size: 10px; opacity: 0.4; }
  @media (prefers-color-scheme: dark) {
    #card { background: #232326; border-color: rgba(255,255,255,0.16);
            box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.08); }
    .chip { background: #2e2e33; color: #f2f2f7;
            border-color: rgba(255,255,255,0.1); }
    .chip.sel { background: #3d3d44; border-color: rgba(255,255,255,0.24);
                box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
  }
</style>
</head>
<body>
<div id="card"></div>
<script>
  const card = document.getElementById('card');
  window.__setTabs = function(tabs, sel) {
    card.innerHTML = '';
    tabs.forEach((t, i) => {
      const c = document.createElement('div');
      c.className = 'chip' + (i === sel ? ' sel' : '');
      c.innerHTML = '<span class="idx">' + (i + 1) + '</span>' +
                    '<span class="title"></span>';
      c.querySelector('.title').textContent = t.title || 'New Tab';
      card.appendChild(c);
    });
  };
</script>
</body>
</html>
