<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  #card {
    display: flex; gap: 10px; padding: 14px;
    width: 100%; overflow-x: auto;
    border-radius: 22px;
    background: rgba(242, 242, 246, 0.42);
    backdrop-filter: blur(40px) saturate(1.9);
    -webkit-backdrop-filter: blur(40px) saturate(1.9);
    border: 0.5px solid rgba(255,255,255,0.45);
    box-shadow: 0 18px 50px rgba(0,0,0,0.22), 0 2px 8px rgba(0,0,0,0.10),
                inset 0 0.5px 0 rgba(255,255,255,0.5);
  }
  .chip {
    flex: 1 1 0; min-width: 64px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 12px 10px 9px;
    border-radius: 14px;
    font-size: 12px; font-weight: 500; color: #1d1d1f;
    background: rgba(255,255,255,0.28);
    border: 0.5px solid rgba(255,255,255,0.35);
    white-space: nowrap;
  }
  .chip.sel {
    background: rgba(255,255,255,0.78);
    border-color: rgba(255,255,255,0.9);
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  }
  .chip .title { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .chip .idx { font-size: 10px; opacity: 0.4; }
  @media (prefers-color-scheme: dark) {
    #card { background: rgba(24,24,27,0.5); border-color: rgba(255,255,255,0.16); }
    .chip { background: rgba(255,255,255,0.07); color: #f2f2f7;
            border-color: rgba(255,255,255,0.1); }
    .chip.sel { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.35); }
  }
</style>
</head>
<body>
<div id="card"></div>
<script>
  const card = document.getElementById('card');
  window.__setTabs = function(tabs, sel) {
    card.innerHTML = '';
    tabs.forEach((t, i) => {
      const c = document.createElement('div');
      c.className = 'chip' + (i === sel ? ' sel' : '');
      c.innerHTML = '<span class="idx">' + (i + 1) + '</span>' +
                    '<span class="title"></span>';
      c.querySelector('.title').textContent = t.title || 'New Tab';
      card.appendChild(c);
    });
  };
</script>
</body>
</html>
