<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    height: 100vh; display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #toast {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 18px; border-radius: 16px;
    background: #ededf1;
    border: 0.5px solid rgba(0,0,0,0.16);
    box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.7);
    font-size: 13px; font-weight: 500; color: #1d1d1f;
    max-width: 420px;
    opacity: 0; transform: translateY(10px);
    transition: opacity .18s ease, transform .18s ease;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #icon { font-size: 15px; }
  #msg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (prefers-color-scheme: dark) {
    #toast { background: #232326;
             border-color: rgba(255,255,255,0.16); color: #f2f2f7; }
  }
</style>
</head>
<body>
<div id="toast"><span id="icon">↓</span><span id="msg"></span></div>
<script>
  const el = document.getElementById('toast');
  const msg = document.getElementById('msg');
  const icon = document.getElementById('icon');
  window.__toastMsg = function(text, kind) {
    msg.textContent = text;
    icon.textContent = kind === 'fail' ? '⚠' : kind === 'done' ? '✓' : '↓';
    el.classList.add('show');
  };
  window.__toastHide = function() { el.classList.remove('show'); };
</script>
</body>
</html>
