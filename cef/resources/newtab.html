<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>New Tab</title>
    <script src="toast://config/"></script>
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
        background: #f5f4f2;
        color: #3a3835;
      }
      /* glassy toast: windowed CEF can't be transparent, so the page
         fakes liquid glass with a blurred layer of the desktop wallpaper
         (toast://wallpaper) matching the real glass border */
      body.glass {
        background: transparent;
      }
      body.glass::before {
        content: '';
        position: fixed;
        inset: 0;
        background: url('toast://wallpaper/') center / cover no-repeat;
        filter: blur(48px) saturate(1.6) brightness(1.08);
        transform: scale(1.15);  /* hide blur edge falloff */
        z-index: -1;
      }
      /* milky pane: mostly-white frosted layer over the wallpaper blur,
         so the webview reads as a white glass pane inside the liquid
         glass border */
      body.glass::after {
        content: '';
        position: fixed;
        inset: 0;
        background: rgba(252, 251, 250, 0.66);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.75);
        z-index: -1;
      }
      body.glass #bar {
        background: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(24px) saturate(1.4);
        border-color: rgba(255, 255, 255, 0.45);
      }
      #bar {
        display: flex;
        align-items: center;
        width: min(640px, 72vw);
        height: 54px;
        border-radius: 16px;
        background: #fff;
        border: 1px solid rgba(0, 0, 0, 0.08);
        box-shadow:
          0 2px 8px rgba(0, 0, 0, 0.05),
          0 12px 32px rgba(0, 0, 0, 0.07);
      }
      #search {
        flex: 1;
        height: 100%;
        border: none;
        outline: none;
        background: transparent;
        padding: 0 20px;
        font: 16px -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
        color: inherit;
      }
      #search::placeholder {
        color: #a3a09a;
      }
      .hint {
        position: fixed;
        bottom: 26px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 13px;
        color: #8a8781;
      }
      .hint kbd {
        font: 12px -apple-system, sans-serif;
        color: #8a8781;
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 1px 5px;
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #242322;
          color: #e8e6e3;
        }
        body.glass {
          background: transparent;
        }
        body.glass::after {
          background: rgba(24, 24, 26, 0.62);
          box-shadow:
            inset 0 0 0 1px rgba(255, 255, 255, 0.14),
            inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }
        body.glass::before {
          filter: blur(48px) saturate(1.5) brightness(0.9);
        }
        body.glass #bar {
          background: rgba(30, 30, 32, 0.45);
          border-color: rgba(255, 255, 255, 0.18);
        }
        #bar {
          background: rgba(255, 255, 255, 0.09);
          border-color: rgba(255, 255, 255, 0.14);
          box-shadow:
            0 2px 8px rgba(0, 0, 0, 0.25),
            0 12px 32px rgba(0, 0, 0, 0.35);
        }
        #search::placeholder {
          color: #7d7a75;
        }
        .hint {
          color: #8f8c87;
        }
        .hint kbd {
          background: #383736;
          color: #8f8c87;
          border-color: rgba(255, 255, 255, 0.14);
        }
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <input
        id="search"
        type="text"
        placeholder="Search or type a URL"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        autofocus
      />
    </div>
    <div class="hint"><kbd>&#8984;K</kbd> for the command toast &nbsp;&middot;&nbsp; <kbd>&#8984;T</kbd> new tab &nbsp;&middot;&nbsp; <kbd>&#8963;Tab</kbd> switch tabs</div>
    <script>
      // window.__toast is injected by toast://config (engine base + name).
      const cfg = window.__toast || { engine: 'https://duckduckgo.com/?q=', engineName: 'DuckDuckGo' };
      if (cfg.glass) document.body.classList.add('glass');
      const input = document.getElementById('search');
      input.placeholder = `Search with ${cfg.engineName} or type a URL`;
      input.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        const s = input.value.trim();
        if (!s) return;
        let url;
        if (/^chrome:\/\//i.test(s)) {
          url = `toast://${s.slice('chrome://'.length)}`;
        } else if (/^localhost(:\d+)?([/?#]|$)/.test(s)) {
          // Before the scheme test: "localhost:8080/x" reads as scheme
          // "localhost" otherwise. Plain http for local servers.
          url = `http://${s}`;
        } else if (/^[^\s]+\.[^\s]{2,}$/.test(s)) {
          url = `https://${s}`;
        } else if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(s)) {
          url = s;
        } else {
          url = `${cfg.engine}${encodeURIComponent(s)}`;
        }
        window.location.href = url;
      });
      const grab = () => input.focus();
      window.addEventListener('DOMContentLoaded', grab);
      window.addEventListener('focus', grab);
      [0, 50, 150, 400].forEach((t) => setTimeout(grab, t));
    </script>
  </body>
</html>
